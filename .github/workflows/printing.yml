name: Exact-source validation

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full WordCraft commit to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: exact-source-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux (${{ inputs.source_ref }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CRAFT_FONTS_DIR: ${{ github.workspace }}/fonts
      CRAFT_FONTS_REQUIRED: '1'
    defaults:
      run:
        working-directory: source
    steps:
      - name: Validate the source ref
        working-directory: ${{ github.workspace }}
        shell: bash
        run: '[[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]'

      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: finwarman/wordcraft
          ref: ${{ inputs.source_ref }}
          path: source
          persist-credentials: false

      - name: Check out the public font inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: storytold/craft-fonts
          ref: 8dcdacd5153e64560d109541a47d806f26f048c0
          path: fonts
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libvulkan1 mesa-vulkan-drivers \
            libasound2-dev libudev-dev fontconfig

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Record source and build inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          git rev-parse HEAD
          git -C ../fonts rev-parse HEAD
          sha256sum ../fonts/fonts/manifest.txt
          rustc -Vv
          cargo -V
          fc-list | sort
          df -h .

      - name: Run workspace qualification
        run: cargo xtask ci
