[package]
name = "wordcraft-preview-wasm"
description = "Headless DOCX page renderer for a live web preview: no UI, no GPU, no filesystem"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-docx = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-render = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
